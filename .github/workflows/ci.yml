name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npx tsc --project tests/tsconfig.json --noEmit
      - run: npx tsc --project examples/tsconfig.json --noEmit
      - run: npx tsc --project src/keyboard-engine/tests/tsconfig.json --noEmit
      - run: npx tsc --project packages/editor/tests/tsconfig.json --noEmit
      - run: npx tsc --project packages/badge/tests/tsconfig.json --noEmit
      - run: npx tsc --project packages/confirm-dialog/tests/tsconfig.json --noEmit
      - run: npx tsc --project packages/divider/tests/tsconfig.json --noEmit
      - run: npx tsc --project packages/fold/tests/tsconfig.json --noEmit
      - run: npx tsc --project packages/form/tests/tsconfig.json --noEmit
      - run: npx tsc --project packages/key-hint/tests/tsconfig.json --noEmit
      - run: npx tsc --project packages/number-input/tests/tsconfig.json --noEmit
      - run: npx tsc --project packages/progress-bar/tests/tsconfig.json --noEmit
      - run: npx tsc --project packages/search-bar/tests/tsconfig.json --noEmit
      - run: npx tsc --project packages/search-input/tests/tsconfig.json --noEmit
      - run: npx tsc --project packages/select/tests/tsconfig.json --noEmit
      - run: npx tsc --project packages/spinner/tests/tsconfig.json --noEmit
      - run: npx tsc --project packages/tabs/tests/tsconfig.json --noEmit
      - run: npx tsc --project packages/text-input/tests/tsconfig.json --noEmit
      - run: npx tsc --project packages/i18n/tests/tsconfig.json --noEmit
      - run: npx tsc --project packages/theme/tests/tsconfig.json --noEmit
      - run: npx tsc --project packages/event/tests/tsconfig.json --noEmit

      - run: npx vitest run --coverage
