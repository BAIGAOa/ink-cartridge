name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run docs
      - run: |
          cat > documents/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>ink-cartridge API docs</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 480px; margin: 80px auto; padding: 0 20px; }
              a { display: block; padding: 16px 20px; margin: 12px 0; border: 1px solid #ddd; border-radius: 8px; text-decoration: none; color: #333; }
              a:hover { border-color: #06f; color: #06f; }
              a small { display: block; color: #888; margin-top: 4px; }
            </style>
          </head>
          <body>
            <h1>ink-cartridge API docs</h1>
            <a href="framework/"><strong>Framework</strong><small>Core ink-cartridge framework — screen, keyboard, theme, language, CLI</small></a>
            <a href="engine/"><strong>Keyboard Engine</strong><small>Framework-agnostic keyboard event engine</small></a>
          </body>
          </html>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: documents

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
